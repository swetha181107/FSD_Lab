<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, lightblue, #764ba2);
            padding: 30px;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(135deg, lightblue, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 15px;
        }

        .header h2 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 18px;
            padding: 15px;
            background: #f7f8ff;
            border-left: 5px solid lightblue;
            border-radius: 10px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: lightblue;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.25);
        }

        /* Error Messages */
        span {
            display: block;
            color: #e63946;
            font-size: 13px;
            font-weight: bold;
            margin-top: 6px;
        }

        /* Button */
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, lightblue, #764ba2);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.4);
        }

        /* Success Message */
        #successMessage {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            color: #16803a;
            background: #d9fbe5;
            font-weight: bold;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
            }

            .header h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>Student Registration Form</h2>
        <p>Fill in your details to complete registration</p>
    </div>

    <form id="registrationForm">

        <div class="form-group">
            <label>Name:</label>
            <input type="text" id="name" placeholder="Enter your full name">
            <span id="nameError"></span>
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="text" id="email" placeholder="Enter your email">
            <span id="emailError"></span>
        </div>

        <div class="form-group">
            <label>Mobile Number:</label>
            <input type="text" id="mobile" placeholder="Enter 10-digit mobile number">
            <span id="mobileError"></span>
        </div>

        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" placeholder="Enter password">
            <span id="passwordError"></span>
        </div>

        <div class="form-group">
            <label>Confirm Password:</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter password">
            <span id="confirmPasswordError"></span>
        </div>

        <div class="form-group">
            <label>Age:</label>
            <input type="number" id="age" placeholder="Enter your age">
            <span id="ageError"></span>
        </div>

        <div class="form-group">
            <label>Course:</label>
            <select id="course">
                <option value="">-- Select Course --</option>
                <option value="JavaScript">JavaScript</option>
                <option value="NodeJS">Node.js</option>
                <option value="Python">Python</option>
            </select>
            <span id="courseError"></span>
        </div>

        <button type="submit">Register Now</button>

    </form>

    <p id="successMessage"></p>

</div>

<script>

document
.getElementById("registrationForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    let valid = true;

    // Get input values
    let name =
        document.getElementById("name").value.trim();

    let email =
        document.getElementById("email").value.trim();

    let mobile =
        document.getElementById("mobile").value.trim();

    let password =
        document.getElementById("password").value;

    let confirmPassword =
        document.getElementById("confirmPassword").value;

    let age =
        document.getElementById("age").value;

    let course =
        document.getElementById("course").value;


    // Clear previous errors
    document.getElementById("nameError").textContent = "";
    document.getElementById("emailError").textContent = "";
    document.getElementById("mobileError").textContent = "";
    document.getElementById("passwordError").textContent = "";
    document.getElementById("confirmPasswordError").textContent = "";
    document.getElementById("ageError").textContent = "";
    document.getElementById("courseError").textContent = "";
    document.getElementById("successMessage").textContent = "";


    // Name validation
    if (name === "") {

        document.getElementById("nameError")
        .textContent = "Name is required.";

        valid = false;

    } else if (name.length < 3) {

        document.getElementById("nameError")
        .textContent =
        "Name must contain at least 3 characters.";

        valid = false;
    }


    // Email validation
    let emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (email === "") {

        document.getElementById("emailError")
        .textContent = "Email is required.";

        valid = false;

    } else if (!emailPattern.test(email)) {

        document.getElementById("emailError")
        .textContent =
        "Enter a valid email address.";

        valid = false;
    }


    // Mobile validation
    let mobilePattern = /^[0-9]{10}$/;

    if (!mobilePattern.test(mobile)) {

        document.getElementById("mobileError")
        .textContent =
        "Mobile number must contain exactly 10 digits.";

        valid = false;
    }


    // Password validation
    if (password.length < 6) {

        document.getElementById("passwordError")
        .textContent =
        "Password must contain at least 6 characters.";

        valid = false;
    }


    // Confirm password validation
    if (password !== confirmPassword) {

        document.getElementById("confirmPasswordError")
        .textContent =
        "Passwords do not match.";

        valid = false;
    }


    // Age validation
    if (age === "") {

        document.getElementById("ageError")
        .textContent = "Age is required.";

        valid = false;

    } else if (age < 18 || age > 60) {

        document.getElementById("ageError")
        .textContent =
        "Age must be between 18 and 60.";

        valid = false;
    }


    // Course validation
    if (course === "") {

        document.getElementById("courseError")
        .textContent =
        "Please select a course.";

        valid = false;
    }


    // Final result
    if (valid) {

        document.getElementById("successMessage")
        .textContent =
        "✅ Registration successful!";

        document.getElementById("registrationForm")
        .reset();
    }

});

</script>

</body>
</html>
